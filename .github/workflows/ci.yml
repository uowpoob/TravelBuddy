name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Never interrupt a production deployment when another commit arrives.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: travelbuddy
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: travelbuddy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelbuddy -d travelbuddy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # These credentials belong only to this job's disposable services.
      DATABASE_DSN: postgresql://travelbuddy:ci-only-password@127.0.0.1:5432/travelbuddy_ci
      LANGGRAPH_PG_DSN: postgresql://travelbuddy:ci-only-password@127.0.0.1:5432/travelbuddy_ci
      TRAVELBUDDY_TEST_DATABASE_DSN: postgresql://travelbuddy:ci-only-password@127.0.0.1:5432/travelbuddy_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      TRAVELBUDDY_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      AUTH_SECRET_KEY: ci-only-signing-secret-never-used-in-production-123456
      DEEPSEEK_API_KEY: ci-placeholder
      DEEPSEEK_BASE_URL: https://example.invalid
      GD_API_KEY: ""
      LANGSMITH_TRACING: "false"

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check Python code
        run: uv run --locked ruff check backend

      - name: Check deployment scripts
        run: |
          bash -n deploy/scripts/deploy.sh
          bash deploy/tests/test_deploy.sh

      - name: Apply database migrations
        run: uv run --locked alembic upgrade head

      - name: Initialize PostgreSQL checkpoints
        run: uv run --locked python -m backend.scripts.init_checkpoints

      - name: Run backend tests including PostgreSQL and Redis
        run: uv run --locked pytest -ra

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check types and build frontend
        run: npm run build

  deploy:
    name: Deploy production
    needs: [backend, frontend]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: travelbuddy-production
      cancel-in-progress: false

    steps:
      - name: Check out tested code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Deploy tested commit over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Configure DEPLOY_HOST in the production environment}"
          : "${DEPLOY_USER:?Configure DEPLOY_USER in the production environment}"
          : "${DEPLOY_PATH:?Configure DEPLOY_PATH in the production environment}"
          : "${DEPLOY_SSH_KEY:?Configure DEPLOY_SSH_KEY in the production environment}"
          : "${DEPLOY_KNOWN_HOSTS:?Configure DEPLOY_KNOWN_HOSTS in the production environment}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535 ))

          umask 077
          key_file="$RUNNER_TEMP/travelbuddy-deploy-key"
          hosts_file="$RUNNER_TEMP/travelbuddy-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          remote_command=$(python3 -c 'import os, shlex; print(shlex.join(["bash", "-s", "--", os.environ["DEPLOY_PATH"], os.environ["DEPLOY_SHA"]]))')
          ssh -T -p "$DEPLOY_PORT" -i "$key_file" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" < deploy/scripts/deploy.sh
