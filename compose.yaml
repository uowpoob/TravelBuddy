name: travelbuddy

x-backend: &backend
  image: travelbuddy-backend:0.1.0
  build:
    context: .
    dockerfile: deploy/docker/backend.Dockerfile
  env_file:
    - ${APP_ENV_FILE:-./deploy/.env}
  environment:
    AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in deploy/.env}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in deploy/.env}
    DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:?Set DEEPSEEK_BASE_URL in deploy/.env}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:?Set DEEPSEEK_MODEL in deploy/.env}
    GD_API_KEY: ${GD_API_KEY:?Set GD_API_KEY in deploy/.env}
    DATABASE_DSN: postgresql://travelbuddy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@db:5432/travelbuddy
    LANGGRAPH_PG_DSN: postgresql://travelbuddy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@db:5432/travelbuddy
    REDIS_URL: redis://redis:6379/0
    GD_MCP_CACHE_NAMESPACE: travelbuddy:deploy:mcp:v1
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: travelbuddy
      POSTGRES_DB: travelbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbuddy -d travelbuddy"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m backend.scripts.init_checkpoints"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=8)"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  frontend:
    image: travelbuddy-frontend:0.1.0
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
